name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: python scripts/patch_cicflowmeter.py python
      - run: python scripts/check_repository_content.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
      - run: pytest -q tests/
      - run: pytest -q tests/test_worldmodel.py tests/test_worldmodel_baseline.py tests/test_worldmodel_release_gate.py
  release_stub:
    if: false
    runs-on: ubuntu-latest
    steps:
      # For a v* tag, attach artifacts/worldmodel/<active>/report.json and
      # release_gate.json with an explicit release action. Intentionally disabled.
      - run: echo 'Release publishing is disabled.'
